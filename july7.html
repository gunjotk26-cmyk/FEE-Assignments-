<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Board</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.parentbox{
    width:600px;
    height:600px;
    border:2px solid black;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
}

.childbox{
    background:white;
}

.childbox1{
    background:black;
}
</style>
</head>
<body>

<div class="parentbox">

    <!-- Row 1 -->
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>

    <!-- Row 2 -->
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>

    <!-- Row 3 -->
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>

    <!-- Row 4 -->
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>

    <!-- Row 5 -->
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>

    <!-- Row 6 -->
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>

    <!-- Row 7 -->
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>

    <!-- Row 8 -->
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>
    <div class="childbox"></div>
    <div class="childbox1"></div>

</div>

</body>
</html>
